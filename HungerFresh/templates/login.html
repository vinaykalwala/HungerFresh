{% extends 'base.html' %}

{% block content %}

<div class="login-container">

    <div class="login-box">

        <h2>Admin Login</h2>

        <p class="subtitle">
            Login to access dashboard
        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required
                >

            </div>

            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

    </div>

</div>

<style>

    .login-container{
        width:100%;
        min-height:80vh;
        display:flex;
        align-items:center;
        justify-content:center;
        background:#f5f5f5;
    }

    .login-box{
        width:400px;
        background:white;
        padding:40px;
        border-radius:10px;
        box-shadow:0px 0px 10px rgba(0,0,0,0.1);
    }

    .login-box h2{
        margin-bottom:10px;
        text-align:center;
    }

    .subtitle{
        text-align:center;
        color:gray;
        margin-bottom:30px;
    }

    .form-group{
        margin-bottom:20px;
    }

    .form-group label{
        display:block;
        margin-bottom:8px;
        font-weight:bold;
    }

    .form-group input{
        width:100%;
        padding:12px;
        border:1px solid #ccc;
        border-radius:5px;
    }

    .login-btn{
        width:100%;
        padding:12px;
        background:black;
        color:white;
        border:none;
        border-radius:5px;
        cursor:pointer;
        font-size:16px;
    }

    .login-btn:hover{
        background:#333;
    }

</style>

{% endblock %}
