<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

{% load static %}
<style>
    /* ========================================
       PREMIUM ADMIN LOGIN PAGE
       Full background image + Glassmorphism
       Responsive & Modern Design
    ======================================== */
    
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    
    .login-page-wrapper {
    min-height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: flex-start;   /* LEFT SIDE */
    position: relative;
    overflow: hidden;
    padding-left: 80px;            /* SPACE FROM LEFT */
}
    
    /* Premium Background Image */
    .login-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
    }
    
    /* Dark Overlay for better contrast */
    .login-bg-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(to right, rgba(255, 153, 0, 0.9) 0%, rgba(0,0,0,0.2) 100%);
        z-index: 1;
    }
    
    /* Animated Orange Blob Background Effect */
    .animated-blobs {
        position: absolute;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 1;
        pointer-events: none;
    }
    
    .blob {
        position: absolute;
        background: rgba(255,122,0,0.15);
        border-radius: 50%;
        filter: blur(60px);
        animation: floatBlob 20s infinite ease-in-out;
    }
    
    .blob-1 {
        width: 400px;
        height: 400px;
        top: -150px;
        right: -100px;
        animation-delay: 0s;
    }
    
    .blob-2 {
        width: 350px;
        height: 350px;
        bottom: -120px;
        left: -80px;
        animation-delay: 5s;
    }
    
    .blob-3 {
        width: 250px;
        height: 250px;
        top: 40%;
        left: 20%;
        animation-delay: 10s;
    }
    
    @keyframes floatBlob {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.4; }
        50% { transform: translateY(-40px) scale(1.1); opacity: 0.6; }
    }
    
    /* Glassmorphism Login Card */
    .login-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 460px;
        margin: 20px;
        animation: fadeInUp 0.8s ease-out;
        
    }
    /* LARGE SCREENS */
@media (min-width: 1600px){

    .login-container{
        max-width: 550px;
        margin-left: 120px;
    }

    .login-box{
        padding: 60px 50px;
    }

    .login-box h2{
        font-size: 42px;
    }

    .form-group input{
        height: 60px;
        font-size: 18px;
    }

    .login-btn{
        height: 60px;
        font-size: 18px;
    }
}

/* EXTRA LARGE SCREENS */
@media (min-width: 1800px){

    .login-container{
        max-width: 650px;
    }

    .login-box h2{
        font-size: 50px;
    }
}
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(40px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .login-box {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(15px);
        border-radius: 32px;
        padding: 48px 42px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.3);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    
    .login-box:hover {
        transform: translateY(-5px);
        box-shadow: 0 35px 60px -15px rgba(0, 0, 0, 0.3);
    }
    
    /* Logo/Brand Area */
    .header-top{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
}

.logo-icon{
    display: flex;
    align-items: center;
    justify-content: center;
}
    
    
    .logo-icon i {
        font-size: 26px;
        color: #ff7a00;
    }
    
    .login-box h2 {
        font-size: 32px;
        font-weight: 800;
        background: linear-gradient(135deg, #ff7a00);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        margin-bottom: 8px;
        letter-spacing: -0.5px;
    }
    
    .subtitle {
        text-align: center;
        color: #6b7280;
        font-size: 14px;
        margin-bottom: 32px;
        font-weight: 500;
        letter-spacing: 0.3px;
    }
    
    /* Form Styles */
    .form-group {
        margin-bottom: 24px;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #1f2937;
        font-size: 14px;
        letter-spacing: 0.3px;
    }
    
    .form-group label i {
        margin-right: 8px;
        color: #ff7a00;
    }
    
    .input-wrapper {
        position: relative;
    }
    
    .input-wrapper i {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: #9ca3af;
        font-size: 18px;
        transition: 0.3s;
    }
    
    .form-group input {
        width: 100%;
        padding: 14px 16px 14px 48px;
        border: 2px solid #e5e7eb;
        border-radius: 16px;
        font-size: 15px;
        transition: all 0.3s ease;
        background: rgba(255, 255, 255, 0.9);
        font-family: inherit;
    }
    
    .form-group input:focus {
        outline: none;
        border-color: #ff7a00;
        box-shadow: 0 0 0 4px rgba(255, 122, 0, 0.1);
        background: white;
    }
    
    .form-group input:hover {
        border-color: #ff7a00;
    }
    
    /* Login Button */
    .login-btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #ff7a00, #ff5e00);
        color: white;
        border: none;
        border-radius: 16px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 700;
        transition: all 0.3s ease;
        margin-top: 8px;
        position: relative;
        overflow: hidden;
        font-family: inherit;
    }
    
    .login-btn::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        transform: translate(-50%, -50%);
        transition: width 0.6s, height 0.6s;
    }
    
    .login-btn:hover::before {
        width: 300px;
        height: 300px;
    }
    
    .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(255, 122, 0, 0.3);
    }
    
    .login-btn:active {
        transform: translateY(0);
    }
    
    /* Additional Links */
    .login-footer {
        text-align: center;
        margin-top: 28px;
        padding-top: 20px;
        border-top: 1px solid rgba(0, 0, 0, 0.08);
    }
    
    .login-footer a {
        color: #ff7a00;
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
        transition: 0.3s;
    }
    
    .login-footer a:hover {
        color: #ff5e00;
        text-decoration: underline;
    }
    
    /* Error Message Styling */
    .error-message {
        background: rgba(239, 68, 68, 0.1);
        border-left: 4px solid #ef4444;
        padding: 12px 16px;
        border-radius: 12px;
        margin-bottom: 20px;
        color: #dc2626;
        font-size: 13px;
        font-weight: 500;
    }
    
    /* Responsive Design */
    @media (max-width: 768px) {
        .login-container {
            max-width: 90%;
            margin: 15px;
        }
        
        .login-box {
            padding: 35px 28px;
        }
        
        .login-box h2 {
            font-size: 28px;
        }
        
        .logo-icon {
            width: 60px;
            height: 60px;
        }
        
        .logo-icon i {
            font-size: 30px;
        }
        
        .form-group input {
            padding: 12px 16px 12px 44px;
        }
    }
    
    @media (max-width: 480px) {
        .login-box {
            padding: 28px 20px;
        }
        
        .login-box h2 {
            font-size: 24px;
        }
        
        .subtitle {
            font-size: 12px;
            margin-bottom: 24px;
        }
        
        .form-group {
            margin-bottom: 18px;
        }
        
        .login-btn {
            padding: 12px;
        }
    }
    
    /* Dark mode support for better visibility */
    @media (prefers-color-scheme: dark) {
        .login-box {
            background: rgba(30, 30, 40, 0.92);
        }
        
        .form-group label {
            color: #e5e7eb;
        }
        
        .form-group input {
            background: rgba(50, 50, 60, 0.9);
            border-color: #374151;
            color: white;
        }
        
        .form-group input:focus {
            background: rgba(60, 60, 70, 1);
        }
        
        .subtitle {
            color: #9ca3af;
        }
    }
    @media (max-width: 768px) {

    .login-page-wrapper{
        justify-content: center;   /* CENTER IN MOBILE */
        padding-left: 0;
    }

    .login-container {
        max-width: 90%;
        margin: 15px;
    }

}
</style>
</head>

<body>
<div class="login-page-wrapper">
    
    <!-- Premium Background Image -->
    <img class="login-bg" src="{% static 'images/food.jpeg' %}" alt="Background">
    
    <!-- Dark Overlay -->
    <div class="login-bg-overlay"></div>
    
    <!-- Animated Orange Blobs -->
    <div class="animated-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    
    <!-- Login Card -->
    <div class="login-container">
        <div class="login-box">
            
            <div class="login-header">

    <div class="header-top">
        
        <h2><span style="color: #1f2937;">Admin</span> Login</h2>
    </div>

    <p class="subtitle">
        <i class="fa-regular fa-circle-user"></i> Login to access dashboard
    </p>

</div>
            
            {% if messages %}
                {% for message in messages %}
                    <div class="error-message">
                        <i class="fa-solid fa-circle-exclamation"></i> {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
            
            <form method="POST">
                {% csrf_token %}
                
                <div class="form-group">
                    <label><i class="fa-regular fa-user"></i> Username</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user"></i>
                        <input
                            type="text"
                            name="username"
                            placeholder="Enter your username"
                            required
                            autocomplete="off"
                        >
                    </div>
                </div>
                
                <div class="form-group">
                    <label><i class="fa-solid fa-lock"></i> Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input
                            type="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >
                    </div>
                </div>
                
                <button type="submit" class="login-btn">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Login
                </button>
                
               
            </form>
            
        </div>
    </div>
    
</div>

</body>
</html>
