{% extends 'base.html' %}
{% load static %}

{% block content %}

<!-- ========================
     CSS Styles
     ======================== -->
<style>
    :root {
        --svc-orange: #FF6600;
        --svc-orange-dark: #E65A00;
        --svc-danger: #DC3545;
        --svc-danger-dark: #B22234;
        --svc-white: #FFFFFF;
        --svc-cream: #FFF9F2;
        --svc-text-dark: #2C2C2C;
        --svc-text-gray: #757575;
        --svc-shadow-card: 0 20px 40px rgba(0, 0, 0, 0.08);
        --svc-shadow-hover: 0 25px 50px rgba(0, 0, 0, 0.12);
        --svc-transition: all 0.3s ease;
        --radius-lg: 20px;
        --radius-full: 50px;
    }

    /* Background setup – consistent with your other pages */
    .delete-bg-layer {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-color: var(--svc-cream);
        background-image: url('{% static "images/s-bg.webp" %}');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }
    .delete-overlay {
        position: absolute;
        inset: 0;
        background: radial-gradient(
            circle at 50% 40%,
            rgba(255, 255, 255, 0.2) 0%,
            rgba(255, 249, 242, 0.7) 90%
        );
        backdrop-filter: blur(3px);
    }

    /* Main container – centered vertically and horizontally */
    .delete-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 100px 20px 60px;  /* top padding for navbar */
        position: relative;
        z-index: 1;
        box-sizing: border-box;
    }

    /* The card */
    .delete-card {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-radius: var(--radius-lg);
        box-shadow: var(--svc-shadow-card);
        padding: 40px 35px;
        max-width: 550px;
        width: 100%;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.6);
        transition: var(--svc-transition);
        animation: fadeInUp 0.6s ease;
    }
    .delete-card:hover {
        box-shadow: var(--svc-shadow-hover);
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Alert icon */
    .delete-icon {
        font-size: 3.5rem;
        margin-bottom: 10px;
    }

    h2 {
        font-size: 2rem;
        font-weight: 700;
        color: var(--svc-text-dark);
        margin: 0 0 15px;
    }

    .warning-text {
        font-size: 1.1rem;
        color: var(--svc-text-gray);
        line-height: 1.6;
        margin-bottom: 20px;
    }
    .warning-text strong {
        color: var(--svc-orange-dark);
        font-weight: 600;
    }

    /* Service image (if provided) */
    .service-image-preview {
        max-width: 100%;
        width: auto;
        height: auto;
        max-height: 200px;
        border-radius: 12px;
        margin: 20px auto;
        display: block;
        box-shadow: 0 8px 20px rgba(0,0,0,0.06);
        object-fit: cover;
    }

    /* Buttons row */
    .form-actions {
        display: flex;
        gap: 15px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 25px;
    }

    .btn-danger {
        background: linear-gradient(135deg, var(--svc-danger), var(--svc-danger-dark));
        color: white;
        border: none;
        padding: 14px 32px;
        border-radius: var(--radius-full);
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition: var(--svc-transition);
        box-shadow: 0 6px 18px rgba(220, 53, 69, 0.2);
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }
    .btn-danger:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(220, 53, 69, 0.35);
        filter: brightness(1.1);
    }

    .btn-cancel {
        background: var(--svc-white);
        color: var(--svc-text-dark);
        border: 1.5px solid #ddd;
        padding: 14px 32px;
        border-radius: var(--radius-full);
        font-weight: 600;
        font-size: 1rem;
        text-decoration: none;
        transition: var(--svc-transition);
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }
    .btn-cancel:hover {
        border-color: var(--svc-orange);
        background: #fff7ed;
        color: var(--svc-orange);
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(255,102,0,0.08);
    }

    /* Responsive */
    @media (max-width: 600px) {
        .delete-page {
            padding: 90px 16px 40px;
        }
        .delete-card {
            padding: 30px 20px;
        }
        h2 {
            font-size: 1.7rem;
        }
        .btn-danger, .btn-cancel {
            width: 100%;
            justify-content: center;
            padding: 14px 20px;
        }
        .form-actions {
            flex-direction: column;
        }
    }
</style>

<!-- ========================
     Background Layer
     ======================== -->
<div class="delete-bg-layer">
    <div class="delete-overlay"></div>
</div>

<!-- ========================
     Page Content
     ======================== -->
<div class="delete-page">
    <div class="delete-card">

        <div class="delete-icon">⚠️</div>
        <h2>Delete Service</h2>

        <p class="warning-text">
            Are you sure you want to permanently delete<br>
            <strong>{{ service.title }}</strong>?
            This action cannot be undone.
        </p>

        {% if service.image %}
            <img src="{{ service.image.url }}" alt="{{ service.title }}" class="service-image-preview">
        {% endif %}

        <form method="POST" style="margin:0;">
            {% csrf_token %}
            <div class="form-actions">
                <button type="submit" class="btn-danger">
                    🗑️ Confirm Delete
                </button>
                <a href="{% url 'service_list' %}" class="btn-cancel">
                    ← Cancel
                </a>
            </div>
        </form>

    </div>
</div>

{% endblock %}
