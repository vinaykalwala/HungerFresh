{% extends 'base.html' %}

{% block content %}

<div class="edit-gallery-wrapper">

    <div class="edit-gallery-card">

        <div class="gallery-preview">

            {% if gallery.image %}

            <img src="{{ gallery.image.url }}" class="preview-image">

            {% endif %}

            <div class="preview-overlay">

                <span class="preview-tag">
                    PREMIUM GALLERY
                </span>

                <div class="preview-content">

                    <h1>
                        Update Gallery
                    </h1>

                    <p>
                        Clean and modern gallery management experience.
                    </p>

                </div>

            </div>

        </div>

        <div class="form-side">

            <div class="form-header">

                <span>
                    GALLERY MANAGEMENT
                </span>

                <h2>
                    Edit Details
                </h2>

            </div>

            <form method="POST" enctype="multipart/form-data" class="gallery-form">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="update-btn">

                    Update Gallery

                </button>

            </form>

        </div>

    </div>

</div>

<style>
    :root {
        --primary: #ff6b2c;
        --primary-dark: #e85d1f;
        --primary-light: #fff1e6;
        --secondary: #2D2F36;
        --text-dark: #111827;
        --text-gray: #6C727F;
        --border-light: rgba(0, 0, 0, 0.06);
        --shadow-sm: 0 15px 30px rgba(0, 0, 0, 0.08);
        --shadow-md: 0 30px 50px rgba(0, 0, 0, 0.12);
        --transition: all 0.35s ease;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    .edit-gallery-wrapper {

        width: 100%;

        padding: 35px 20px 80px;

        display: flex;

        justify-content: center;

        position: relative;

        overflow: hidden;

        background:
            radial-gradient(circle at top left,
                rgba(255, 115, 0, 0.18),
                transparent 35%),

            radial-gradient(circle at bottom right,
                rgba(255, 140, 0, 0.15),
                transparent 35%),

            linear-gradient(135deg,
                #fffaf5,
                #fff4eb,
                #fffdfb);
    }

    .edit-gallery-card {
        width: 100%;
        max-width: 1250px;
        background: white;
        border-radius: 30px;
        overflow: hidden;
        display: grid;
        grid-template-columns: 45% 55%;
        box-shadow: var(--shadow-md);
        border: 1px solid var(--border-light);
    }

    .gallery-preview {

        position: relative;

        min-height: 560px;

        overflow: hidden;

        display: flex;

        align-items: center;

        justify-content: center;

        background:
            linear-gradient(135deg,
                rgba(255, 115, 0, 0.12),
                rgba(255, 255, 255, 0.05));
    }

    .gallery-preview::after {

        content: "";

        position: absolute;

        inset: 0;

        background:
            linear-gradient(135deg,
                rgba(255, 115, 0, 0.35),
                rgba(255, 140, 0, 0.12),
                rgba(255, 255, 255, 0.08));

        z-index: 1;
    }

    .preview-image {

        width: 88%;

        height: auto;

        max-height: 480px;

        object-fit: contain;

        transform: scale(1);

        transition: 0.5s ease;

        filter:
            brightness(0.96) drop-shadow(0 20px 35px rgba(0, 0, 0, 0.18));
    }

    .edit-gallery-card:hover .preview-image {

        transform: scale(1.03);
    }

    .preview-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(to top,
                rgba(0, 0, 0, 0.85),
                rgba(0, 0, 0, 0.2),
                transparent);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 35px;
        z-index: 2;
    }

    .preview-tag {
        width: max-content;
        padding: 12px 22px;
        border-radius: 50px;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
        color: white;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 2px;
    }

    .preview-content h1 {
        color: white;
        font-size: 52px;
        line-height: 1.1;
        margin-bottom: 15px;
        font-weight: 800;
    }

    .preview-content p {
        color: #f3f4f6;
        line-height: 1.8;
        font-size: 15px;
    }

    .form-side {
        padding: 60px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .form-header span {
        color: var(--primary);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 2px;
    }

    .form-header h2 {
        color: var(--text-dark);
        font-size: 40px;
        margin-top: 12px;
        margin-bottom: 40px;
        font-weight: 800;
    }

    .gallery-form p {
        margin-bottom: 24px;
    }

    .gallery-form label {
        display: block;
        margin-bottom: 10px;
        color: var(--text-dark);
        font-size: 14px;
        font-weight: 700;
    }

    .gallery-form input,
    .gallery-form textarea,
    .gallery-form select {
        width: 100%;
        padding: 16px 18px;
        border-radius: 16px;
        border: 1px solid #e5e7eb;
        outline: none;
        font-size: 15px;
        transition: var(--transition);
        background: white;
        color: var(--text-dark);
    }

    .gallery-form textarea {
        min-height: 140px;
        resize: none;
    }

    .gallery-form input:focus,
    .gallery-form textarea:focus,
    .gallery-form select:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(255, 107, 44, 0.08);
    }

    .gallery-form input[type="file"] {
        padding: 14px;
        cursor: pointer;
    }

    .gallery-form input[type="checkbox"] {
        width: auto;
        transform: scale(1.2);
        margin-right: 10px;
        accent-color: var(--primary);
    }

    .update-btn {
        width: 100%;
        border: none;
        padding: 18px;
        margin-top: 10px;
        border-radius: 18px;
        background: linear-gradient(135deg,
                var(--primary),
                var(--primary-dark));
        color: white;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: var(--transition);
        box-shadow: 0 15px 30px rgba(255, 107, 44, 0.22);
    }

    .update-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 22px 40px rgba(255, 107, 44, 0.32);
    }

    /* =========================
   LARGE LAPTOPS
========================= */

    @media (max-width: 1400px) {

        .edit-gallery-card {

            max-width: 1150px;
        }

        .preview-content h1 {

            font-size: 48px;
        }
    }


    /* =========================
   LAPTOP
========================= */

    @media (max-width: 1200px) {

        .edit-gallery-wrapper {

            padding: 25px 18px 60px;
        }

        .edit-gallery-card {

            grid-template-columns: 45% 55%;
        }

        .form-side {

            padding: 45px;
        }

        .preview-content h1 {

            font-size: 42px;
        }

        .form-header h2 {

            font-size: 34px;
        }
    }


    /* =========================
   TABLET
========================= */

    @media (max-width: 992px) {

        .edit-gallery-card {

            grid-template-columns: 1fr;
        }

        .gallery-preview {

            min-height: 420px;
        }

        .preview-image {

            width: 75%;
        }

        .form-side {

            padding: 40px 30px;
        }

        .preview-content h1 {

            font-size: 38px;
        }
    }


    /* =========================
   MOBILE
========================= */

    @media (max-width: 768px) {

        .edit-gallery-wrapper {

            padding: 15px 12px 40px;
        }

        .edit-gallery-card {

            border-radius: 22px;
        }

        .gallery-preview {

            min-height: 300px;
        }

        .preview-image {

            width: 100%;

            max-height: 260px;

            object-fit: cover;

            padding: 15px;
        }

        .preview-overlay {

            padding: 20px;
        }

        .preview-tag {

            font-size: 10px;

            padding: 10px 18px;
        }

        .preview-content h1 {

            font-size: 30px;

            line-height: 1.2;
        }

        .preview-content p {

            font-size: 13px;

            line-height: 1.6;
        }

        .form-side {

            padding: 28px 20px;
        }

        .form-header span {

            font-size: 11px;
        }

        .form-header h2 {

            font-size: 28px;

            margin-bottom: 28px;
        }

        .gallery-form p {

            margin-bottom: 18px;
        }

        .gallery-form input,
        .gallery-form textarea,
        .gallery-form select {

            padding: 14px;

            font-size: 14px;

            border-radius: 14px;
        }

        .gallery-form textarea {

            min-height: 120px;
        }

        .update-btn {

            padding: 15px;

            font-size: 15px;

            border-radius: 14px;
        }
    }


    /* =========================
   SMALL MOBILE
========================= */

    @media (max-width: 480px) {

        .edit-gallery-wrapper {

            padding: 10px 8px 30px;
        }

        .gallery-preview {

            min-height: 240px;
        }

        .preview-image {

            max-height: 220px;

            padding: 10px;
        }

        .preview-overlay {

            padding: 15px;
        }

        .preview-content h1 {

            font-size: 24px;
        }

        .preview-content p {

            font-size: 12px;
        }

        .form-side {

            padding: 22px 15px;
        }

        .form-header h2 {

            font-size: 24px;
        }

        .gallery-form input,
        .gallery-form textarea,
        .gallery-form select {

            padding: 12px;

            font-size: 13px;
        }

        .update-btn {

            font-size: 14px;
        }
    }


    /* =========================
   EXTRA FIXES
========================= */

    img {

        max-width: 100%;
    }

    body {

        overflow-x: hidden;
    }

    /* =========================
   DJANGO FORM MOBILE FIX
========================= */

    .gallery-form {

        width: 100%;

        overflow: hidden;
    }

    .gallery-form p {

        width: 100%;
    }

    .gallery-form input,
    .gallery-form textarea,
    .gallery-form select {

        max-width: 100%;

        width: 100%;

        display: block;
    }

    .gallery-form a {

        display: block;

        width: 100%;

        overflow-wrap: anywhere;

        word-break: break-word;

        font-size: 13px;

        line-height: 1.5;
    }

    .gallery-form input[type="file"] {

        width: 100%;

        padding: 10px;

        font-size: 12px;

        overflow: hidden;
    }

    .gallery-form textarea {

        width: 100%;

        max-width: 100%;

        overflow: auto;
    }

    .form-side {

        overflow: hidden;
    }


    /* MOBILE EXTRA FIX */

    @media(max-width:480px) {

        .form-side {

            padding: 18px 12px;
        }

        .gallery-form label {

            font-size: 13px;
        }

        .gallery-form input,
        .gallery-form textarea,
        .gallery-form select {

            font-size: 12px;

            padding: 10px 12px;
        }

        .gallery-form a {

            font-size: 11px;
        }

        .update-btn {

            width: 100%;

            font-size: 13px;

            padding: 13px;
        }
    }
</style>

{% endblock %}
